services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - feeds_data:/data
    # cap_add NET_RAW нужен nmap для SYN/OS-fingerprint; включается осознанно
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "8000:8000"
    # Единый источник схемы — Alembic: применяем миграции, затем запускаем API.
    # (Раньше схема грузилась через initdb-SQL в обход Alembic, из-за чего
    # расходились две ветки инициализации — см. PR интеграции.)
    command: sh -c "alembic upgrade head && uvicorn scanner.api.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  feeds_data:
