services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      # Выгрузка БДУ ФСТЭК и прочие данные: положите vullist.xlsx сюда и
      # укажите BDU_FSTEC_FEED_PATH — entrypoint загрузит её один раз при старте.
      - ./data:/data
    # cap_add NET_RAW нужен nmap для SYN/OS-fingerprint; включается осознанно
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # API нужен снаружи только для отладки: веб ходит в него по сети compose.
    # Поэтому по умолчанию он слушает только localhost хоста. Порт хоста
    # меняется в .env (SCANNER_API_PORT), если 8000 уже занят.
    ports:
      - "127.0.0.1:${SCANNER_API_PORT:-8000}:8000"
    # ENTRYPOINT образа (docker/entrypoint.sh) сам готовит окружение:
    # миграции -> одноразовая загрузка БДУ -> шаблоны Nuclei -> запуск API.
    restart: unless-stopped

  web:
    # Веб-интерфейс (React + nginx). nginx проксирует /api/* на сервис app,
    # поэтому UI и API живут на одном origin и CORS не нужен. API_UPSTREAM
    # указывает на внутреннее имя сервиса API в сети compose (app:8000).
    build:
      context: ./web
    environment:
      API_UPSTREAM: http://app:8000
    depends_on:
      - app
    # Единственный порт, который нужен пользователям. Порт хоста — SCANNER_WEB_PORT.
    ports:
      - "${SCANNER_WEB_PORT:-8080}:8080"
    restart: unless-stopped

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Только localhost хоста (резервные копии, отладка). Порт — SCANNER_DB_PORT.
    ports:
      - "127.0.0.1:${SCANNER_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
