services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      # Выгрузка БДУ ФСТЭК и прочие данные: положите vullist.xlsx сюда и
      # укажите BDU_FSTEC_FEED_PATH — entrypoint загрузит её один раз при старте.
      - ./data:/data
    # cap_add NET_RAW нужен nmap для SYN/OS-fingerprint; включается осознанно
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "8000:8000"
    # ENTRYPOINT образа (docker/entrypoint.sh) сам готовит окружение:
    # миграции -> одноразовая загрузка БДУ -> шаблоны Nuclei -> запуск API.
    restart: unless-stopped

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
