services:
  app:
    build: .
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./:/app
      - feeds_data:/data
    # cap_add NET_RAW нужен nmap для SYN/OS-fingerprint; включается осознанно
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "8000:8000"
    command: uvicorn scanner.api.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

volumes:
  pg_data:
  feeds_data:
