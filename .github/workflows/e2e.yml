name: e2e

# Сквозной сценарий на живом стеке Docker (scripts/e2e.sh): долгий, поэтому
# не на каждый PR, а вручную (Actions → e2e → Run workflow) и по ночам.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Playwright для проверки UI
        working-directory: web
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Сценарий
        env:
          E2E_REQUIRE_UI: "1"
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14
