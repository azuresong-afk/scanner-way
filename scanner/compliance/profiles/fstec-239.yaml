# Приказ ФСТЭК России от 25.12.2017 №239 — меры по обеспечению безопасности
# значимых объектов критической информационной инфраструктуры (приложение к
# Требованиям: состав мер по категориям значимости 1–3).
#
# Формат — как у fstec-117.yaml: levels — категории значимости, для которых мера
# входит в базовый набор; меры без checks (включая .0 «Регламентация…») —
# организационные и проверяются вручную. Базовый набор адаптируется под объект
# (excluded/added в профиле договора).

id: fstec-239
title: Приказ ФСТЭК России №239 (значимые объекты КИИ)
short: ФСТЭК №239
document: >-
  Требования по обеспечению безопасности значимых объектов критической
  информационной инфраструктуры Российской Федерации (утв. приказом ФСТЭК
  России от 25.12.2017 №239), приложение «Состав мер по обеспечению
  безопасности для значимого объекта соответствующей категории значимости»
url: https://fstec.ru/dokumenty/vse-dokumenty/prikazy/prikaz-fstek-rossii-ot-25-dekabrya-2017-g-n-239
level_label: Категория значимости
levels: ["1", "2", "3"]
default_level: "2"

groups:
  - code: ИАФ
    title: Идентификация и аутентификация
    controls:
      - {id: ИАФ.0, title: "Регламентация правил и процедур идентификации и аутентификации", levels: ["1", "2", "3"]}
      - {id: ИАФ.1, title: "Идентификация и аутентификация пользователей и инициируемых ими процессов", levels: ["1", "2", "3"], checks: [no_empty_passwords, ssh_root_login, weak_credentials, ntlm_no_lm]}
      - {id: ИАФ.2, title: "Идентификация и аутентификация устройств", levels: ["1", "2"]}
      - {id: ИАФ.3, title: "Управление идентификаторами", levels: ["1", "2", "3"]}
      - {id: ИАФ.4, title: "Управление средствами аутентификации", levels: ["1", "2", "3"], checks: [password_length, password_complexity, password_age, password_history, auth_hash_files, lsa_protection]}
      - {id: ИАФ.5, title: "Идентификация и аутентификация внешних пользователей", levels: ["1", "2", "3"], checks: [weak_credentials]}
      - {id: ИАФ.6, title: "Двусторонняя аутентификация", levels: []}
      - {id: ИАФ.7, title: "Защита аутентификационной информации при передаче", levels: ["1", "2", "3"], checks: [insecure_remote_protocols, ntlm_no_lm]}

  - code: УПД
    title: Управление доступом
    controls:
      - {id: УПД.0, title: "Регламентация правил и процедур управления доступом", levels: ["1", "2", "3"]}
      - {id: УПД.1, title: "Управление учётными записями пользователей", levels: ["1", "2", "3"]}
      - {id: УПД.2, title: "Реализация политик управления доступом", levels: ["1", "2", "3"], checks: [auth_hash_files, mac_enabled]}
      - {id: УПД.3, title: "Доверенная загрузка", levels: ["1", "2"], checks: [boot_loader_password]}
      - {id: УПД.4, title: "Разделение полномочий (ролей) пользователей", levels: ["1", "2", "3"], checks: [ssh_root_login]}
      - {id: УПД.5, title: "Назначение минимально необходимых прав и привилегий", levels: ["1", "2", "3"], checks: [least_privilege_sudo, uac]}
      - {id: УПД.6, title: "Ограничение неуспешных попыток доступа в информационную (автоматизированную) систему", levels: ["1", "2", "3"], checks: [lockout, ssh_max_auth_tries]}
      - {id: УПД.7, title: "Предупреждение пользователя при его доступе к информационным ресурсам", levels: [], checks: [login_banner]}
      - {id: УПД.8, title: "Оповещение пользователя при успешном входе о предыдущем доступе к информационной (автоматизированной) системе", levels: []}
      - {id: УПД.9, title: "Ограничение числа параллельных сеансов доступа", levels: []}
      - {id: УПД.10, title: "Блокирование сеанса доступа пользователя при неактивности", levels: ["1", "2", "3"], checks: [session_timeout]}
      - {id: УПД.11, title: "Управление действиями пользователей до идентификации и аутентификации", levels: ["1", "2", "3"]}
      - {id: УПД.12, title: "Управление атрибутами безопасности", levels: []}
      - {id: УПД.13, title: "Реализация защищённого удалённого доступа", levels: ["1", "2", "3"], checks: [insecure_remote_protocols, ssh_crypto, rdp_nla]}
      - {id: УПД.14, title: "Контроль доступа из внешних информационных (автоматизированных) систем", levels: ["1", "2", "3"], checks: [firewall_enabled]}

  - code: ОПС
    title: Ограничение программной среды
    controls:
      - {id: ОПС.0, title: "Регламентация правил и процедур ограничения программной среды", levels: ["1", "2"]}
      - {id: ОПС.1, title: "Управление запуском (обращениями) компонентов программного обеспечения", levels: ["1"]}
      - {id: ОПС.2, title: "Управление установкой (инсталляцией) компонентов программного обеспечения", levels: ["1", "2"], checks: [package_signatures, insecure_packages, unneeded_services]}
      - {id: ОПС.3, title: "Управление временными файлами", levels: []}

  - code: ЗНИ
    title: Защита машинных носителей информации
    controls:
      - {id: ЗНИ.0, title: "Регламентация правил и процедур защиты машинных носителей информации", levels: ["1", "2", "3"]}
      - {id: ЗНИ.1, title: "Учёт машинных носителей информации", levels: ["1", "2"]}
      - {id: ЗНИ.2, title: "Управление физическим доступом к машинным носителям информации", levels: ["1", "2", "3"]}
      - {id: ЗНИ.3, title: "Контроль перемещения машинных носителей информации за пределы контролируемой зоны", levels: []}
      - {id: ЗНИ.4, title: "Исключение возможности несанкционированного ознакомления с содержанием информации, хранящейся на машинных носителях информации", levels: []}
      - {id: ЗНИ.5, title: "Контроль использования интерфейсов ввода (вывода) информации на съёмные машинные носители информации", levels: ["1", "2", "3"], checks: [removable_media]}
      - {id: ЗНИ.6, title: "Контроль ввода (вывода) информации на съёмные машинные носители информации", levels: []}
      - {id: ЗНИ.7, title: "Контроль подключения съёмных машинных носителей информации", levels: ["1", "2"], checks: [removable_media]}
      - {id: ЗНИ.8, title: "Уничтожение (стирание) информации на машинных носителях информации", levels: ["1", "2", "3"]}

  - code: АУД
    title: Аудит безопасности
    controls:
      - {id: АУД.0, title: "Регламентация правил и процедур аудита безопасности", levels: ["1", "2", "3"]}
      - {id: АУД.1, title: "Инвентаризация информационных ресурсов", levels: ["1", "2", "3"]}
      - {id: АУД.2, title: "Анализ уязвимостей и их устранение", levels: ["1", "2", "3"], checks: [no_critical_vulns, security_updates]}
      - {id: АУД.3, title: "Генерирование временных меток и (или) синхронизация системного времени", levels: ["1", "2", "3"], checks: [time_sync]}
      - {id: АУД.4, title: "Регистрация событий безопасности", levels: ["1", "2", "3"], checks: [audit_daemon, audit_rules, syslog]}
      - {id: АУД.5, title: "Контроль и защита информации о событиях безопасности", levels: ["1", "2", "3"], checks: [audit_log_protection, audit_storage]}
      - {id: АУД.6, title: "Анализ событий безопасности", levels: ["1", "2", "3"]}
      - {id: АУД.7, title: "Мониторинг безопасности", levels: ["1", "2", "3"]}
      - {id: АУД.8, title: "Реконструкция событий безопасности", levels: ["1", "2"]}
      - {id: АУД.9, title: "Анализ и оптимизация функционирования системы аудита", levels: []}
      - {id: АУД.10, title: "Проведение внутренних аудитов", levels: ["1", "2", "3"]}
      - {id: АУД.11, title: "Проведение внешних аудитов", levels: ["1"]}

  - code: АВЗ
    title: Антивирусная защита
    controls:
      - {id: АВЗ.0, title: "Регламентация правил и процедур антивирусной защиты", levels: ["1", "2", "3"]}
      - {id: АВЗ.1, title: "Реализация антивирусной защиты", levels: ["1", "2", "3"], checks: [antimalware]}
      - {id: АВЗ.2, title: "Антивирусная защита электронной почты и иных сервисов", levels: ["1", "2", "3"]}
      - {id: АВЗ.3, title: "Контроль использования архивных, исполняемых и зашифрованных файлов", levels: ["1"]}
      - {id: АВЗ.4, title: "Обновление базы данных признаков вредоносных компьютерных программ (вирусов)", levels: ["1", "2", "3"]}
      - {id: АВЗ.5, title: "Использование средств антивирусной защиты различных производителей", levels: ["1"]}

  - code: СОВ
    title: Предотвращение вторжений (компьютерных атак)
    controls:
      - {id: СОВ.0, title: "Регламентация правил и процедур предотвращения вторжений (компьютерных атак)", levels: ["1", "2"]}
      - {id: СОВ.1, title: "Обнаружение и предотвращение компьютерных атак", levels: ["1", "2"]}
      - {id: СОВ.2, title: "Обновление базы решающих правил", levels: ["1", "2"]}

  - code: ОЦЛ
    title: Обеспечение целостности
    controls:
      - {id: ОЦЛ.0, title: "Регламентация правил и процедур обеспечения целостности", levels: ["1", "2", "3"]}
      - {id: ОЦЛ.1, title: "Контроль целостности программного обеспечения", levels: ["1", "2"], checks: [file_integrity]}
      - {id: ОЦЛ.2, title: "Контроль целостности информации", levels: []}
      - {id: ОЦЛ.3, title: "Ограничения по вводу информации в информационную (автоматизированную) систему", levels: ["1"]}
      - {id: ОЦЛ.4, title: "Контроль данных, вводимых в информационную (автоматизированную) систему", levels: ["1", "2"]}
      - {id: ОЦЛ.5, title: "Контроль ошибочных действий пользователей по вводу и (или) передаче информации и предупреждение пользователей об ошибочных действиях", levels: ["1", "2"]}
      - {id: ОЦЛ.6, title: "Обезличивание и (или) деидентификация информации", levels: []}

  - code: ОДТ
    title: Обеспечение доступности
    controls:
      - {id: ОДТ.0, title: "Регламентация правил и процедур обеспечения доступности", levels: ["1", "2", "3"]}
      - {id: ОДТ.1, title: "Использование отказоустойчивых технических средств", levels: ["1", "2"]}
      - {id: ОДТ.2, title: "Резервирование средств и систем", levels: ["1", "2"]}
      - {id: ОДТ.3, title: "Контроль безотказного функционирования средств и систем", levels: ["1", "2"]}
      - {id: ОДТ.4, title: "Резервное копирование информации", levels: ["1", "2", "3"]}
      - {id: ОДТ.5, title: "Обеспечение возможности восстановления информации", levels: ["1", "2", "3"]}
      - {id: ОДТ.6, title: "Обеспечение возможности восстановления программного обеспечения при нештатных ситуациях", levels: ["1", "2", "3"]}
      - {id: ОДТ.7, title: "Кластеризация информационной (автоматизированной) системы", levels: []}
      - {id: ОДТ.8, title: "Контроль предоставляемых вычислительных ресурсов и каналов связи", levels: ["1", "2", "3"]}

  - code: ЗТС
    title: Защита технических средств и систем
    controls:
      - {id: ЗТС.0, title: "Регламентация правил и процедур защиты технических средств и систем", levels: ["1", "2", "3"]}
      - {id: ЗТС.2, title: "Организация контролируемой зоны", levels: ["1", "2", "3"]}
      - {id: ЗТС.3, title: "Управление физическим доступом", levels: ["1", "2", "3"]}
      - {id: ЗТС.4, title: "Размещение устройств вывода (отображения) информации, исключающее её несанкционированный просмотр", levels: ["1", "2", "3"]}
      - {id: ЗТС.5, title: "Защита от внешних воздействий", levels: ["1", "2", "3"]}

  - code: ЗИС
    title: Защита информационной (автоматизированной) системы и её компонентов
    controls:
      - {id: ЗИС.0, title: "Регламентация правил и процедур защиты информационной (автоматизированной) системы и её компонентов", levels: ["1", "2", "3"]}
      - {id: ЗИС.1, title: "Разделение функций по управлению (администрированию) информационной (автоматизированной) системой с иными функциями", levels: ["1", "2"]}
      - {id: ЗИС.3, title: "Обеспечение защиты информации от раскрытия, модификации и навязывания (ввода ложной информации) при её передаче (подготовке к передаче) по каналам связи, имеющим выход за пределы контролируемой зоны", levels: ["1", "2", "3"], checks: [insecure_remote_protocols, ssh_crypto, ntlm_no_lm]}
      - {id: ЗИС.5, title: "Запрет несанкционированной удалённой активации периферийных устройств", levels: ["1", "2", "3"]}
      - {id: ЗИС.11, title: "Обеспечение подлинности сетевых соединений", levels: ["1", "2"], checks: [ssh_crypto, smb1_disabled]}

  - code: ИНЦ
    title: Реагирование на компьютерные инциденты
    controls:
      - {id: ИНЦ.0, title: "Регламентация правил и процедур выявления компьютерных инцидентов и реагирования на них", levels: ["1", "2", "3"]}
      - {id: ИНЦ.1, title: "Выявление компьютерных инцидентов", levels: ["1", "2", "3"]}
      - {id: ИНЦ.2, title: "Информирование о компьютерных инцидентах", levels: ["1", "2", "3"]}
      - {id: ИНЦ.3, title: "Анализ компьютерных инцидентов", levels: ["1", "2", "3"]}
      - {id: ИНЦ.4, title: "Устранение последствий компьютерных инцидентов", levels: ["1", "2", "3"]}
      - {id: ИНЦ.5, title: "Принятие мер по предотвращению повторного возникновения компьютерных инцидентов", levels: ["1", "2", "3"]}
      - {id: ИНЦ.6, title: "Хранение и защита информации о компьютерных инцидентах", levels: ["1", "2", "3"]}

  - code: УКФ
    title: Управление конфигурацией
    controls:
      - {id: УКФ.0, title: "Регламентация правил и процедур управления конфигурацией информационной (автоматизированной) системы", levels: ["1", "2", "3"]}
      - {id: УКФ.1, title: "Идентификация объектов управления конфигурацией", levels: ["1", "2"]}
      - {id: УКФ.2, title: "Управление изменениями", levels: ["1", "2", "3"]}
      - {id: УКФ.3, title: "Установка (инсталляция) только разрешённого к использованию программного обеспечения", levels: ["1", "2", "3"], checks: [insecure_packages, unneeded_services]}
      - {id: УКФ.4, title: "Контроль действий по внесению изменений", levels: ["1", "2"]}

  - code: ОПО
    title: Обеспечение безопасности при поддержке программного обеспечения
    controls:
      - {id: ОПО.0, title: "Регламентация правил и процедур управления обновлениями программного обеспечения", levels: ["1", "2", "3"]}
      - {id: ОПО.1, title: "Поиск, получение обновлений программного обеспечения от доверенного источника", levels: ["1", "2", "3"], checks: [package_signatures]}
      - {id: ОПО.2, title: "Контроль целостности обновлений программного обеспечения", levels: ["1", "2", "3"], checks: [package_signatures]}
      - {id: ОПО.3, title: "Тестирование обновлений программного обеспечения", levels: ["1", "2", "3"]}
      - {id: ОПО.4, title: "Установка обновлений программного обеспечения", levels: ["1", "2", "3"], checks: [security_updates, auto_updates_windows]}

  - code: ПЛН
    title: Планирование мероприятий по обеспечению безопасности
    controls:
      - {id: ПЛН.0, title: "Регламентация правил и процедур планирования мероприятий по обеспечению защиты информации", levels: ["1", "2", "3"]}
      - {id: ПЛН.1, title: "Разработка, утверждение и актуализация плана мероприятий по обеспечению защиты информации", levels: ["1", "2", "3"]}
      - {id: ПЛН.2, title: "Контроль выполнения мероприятий по обеспечению защиты информации", levels: ["1", "2", "3"]}

  - code: ДНС
    title: Действия в нештатных ситуациях
    controls:
      - {id: ДНС.0, title: "Регламентация правил и процедур обеспечения действий в нештатных (непредвиденных) ситуациях", levels: ["1", "2", "3"]}
      - {id: ДНС.1, title: "Разработка плана действий в нештатных (непредвиденных) ситуациях", levels: ["1", "2", "3"]}
      - {id: ДНС.2, title: "Обучение и отработка действий персонала в нештатных (непредвиденных) ситуациях", levels: ["1", "2", "3"]}
      - {id: ДНС.3, title: "Создание альтернативных мест хранения и обработки информации на случай возникновения нештатных (непредвиденных) ситуаций", levels: ["1"]}
      - {id: ДНС.4, title: "Резервирование программного обеспечения, технических средств, каналов связи на случай возникновения нештатных (непредвиденных) ситуаций", levels: ["1", "2"]}
      - {id: ДНС.5, title: "Обеспечение возможности восстановления информационной (автоматизированной) системы в случае возникновения нештатных (непредвиденных) ситуаций", levels: ["1", "2", "3"]}
      - {id: ДНС.6, title: "Анализ возникших нештатных (непредвиденных) ситуаций и принятие мер по недопущению их повторного возникновения", levels: ["1", "2", "3"]}

  - code: ИПО
    title: Информирование и обучение персонала
    controls:
      - {id: ИПО.0, title: "Регламентация правил и процедур информирования и обучения персонала", levels: ["1", "2", "3"]}
      - {id: ИПО.1, title: "Информирование персонала об угрозах безопасности информации и о правилах безопасной работы", levels: ["1", "2", "3"]}
      - {id: ИПО.2, title: "Обучение персонала правилам безопасной работы", levels: ["1", "2", "3"]}
      - {id: ИПО.3, title: "Проведение практических занятий с персоналом по правилам безопасной работы", levels: ["1", "2"]}
      - {id: ИПО.4, title: "Контроль осведомлённости персонала об угрозах безопасности информации и о правилах безопасной работы", levels: ["1", "2", "3"]}
