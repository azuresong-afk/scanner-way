# Каталог технических проверок для профилей соответствия (R5).
#
# Проверка — то, что сканер умеет установить сам по результатам прогона. Меры
# приказов ФСТЭК и пункты CIS ссылаются на проверки по id (profiles/*.yaml).
#
# Источники (у проверки может быть несколько; нарушение в любом из них = провал):
#   openscap:        короткие id правил SCAP Security Guide (без префикса
#                    xccdf_org.ssgproject.content_rule_); выполнено — правило
#                    было в профиле XCCDF прогона и дало pass/fail;
#   lynis:           TEST-ID Lynis; выполнено — тест в tests_executed отчёта;
#   password_policy: ключи проверки парольной политики (lockout, min-length,
#                    complexity, max-age) — POLICY:password-<ключ>;
#   windows:         условия на параметры безопасности Windows (R3):
#                    {key, op: eq|ne|ge|le, value, missing: <значение по
#                    умолчанию> | na}; when — условие применимости;
#   vulns:           {min_severity, modules}: открытые уязвимости не ниже
#                    уровня от модулей; выполнено — хост проверен этими модулями;
#   services:        {names, tcp_ports, udp_ports}: открытые небезопасные сервисы
#                    (по discovery);
#   cred_audit:      true — слабые/стандартные учётные данные (по наборам
#                    оператора).
#
# platform: linux | windows | any — на каких хостах проверка имеет смысл.
# Если ни один источник на хосте не выполнялся, проверка «не проверена» и в
# процент не входит (ни как выполненная, ни как проваленная).

checks:

  # ---------- Идентификация, аутентификация, пароли ----------
  - id: lockout
    title: Блокировка учётной записи после неудачных попыток входа
    platform: linux
    password_policy: [lockout]
    openscap: [accounts_passwords_pam_faillock_deny, accounts_passwords_pam_faillock_unlock_time,
               accounts_passwords_pam_tally2]
    remediation: >-
      Включить pam_faillock (faillock.conf: deny = 5 или меньше, unlock_time ≥ 900)
      в стеке PAM аутентификации.
    doc: https://man7.org/linux/man-pages/man5/faillock.conf.5.html

  - id: password_length
    title: Минимальная длина пароля
    platform: linux
    password_policy: [min-length]
    openscap: [accounts_password_pam_minlen, accounts_password_minlen_login_defs]
    remediation: Задать minlen в /etc/security/pwquality.conf не менее 8 (по требованиям заказчика — больше).
    doc: https://man7.org/linux/man-pages/man5/pwquality.conf.5.html

  - id: password_complexity
    title: Требования к сложности пароля
    platform: linux
    password_policy: [complexity]
    openscap: [accounts_password_pam_minclass, accounts_password_pam_dcredit,
               accounts_password_pam_ucredit, accounts_password_pam_lcredit,
               accounts_password_pam_ocredit]
    lynis: [AUTH-9262]
    remediation: Задать в pwquality.conf minclass ≥ 3 или отрицательные dcredit/ucredit/lcredit/ocredit.
    doc: https://man7.org/linux/man-pages/man5/pwquality.conf.5.html

  - id: password_age
    title: Ограничение срока действия пароля
    platform: linux
    password_policy: [max-age]
    openscap: [accounts_maximum_age_login_defs, accounts_minimum_age_login_defs]
    lynis: [AUTH-9286]
    remediation: Задать PASS_MAX_DAYS (не более 365, по политике заказчика) и PASS_MIN_DAYS в /etc/login.defs.
    doc: https://man7.org/linux/man-pages/man5/login.defs.5.html

  - id: password_history
    title: Запрет повторного использования паролей
    platform: linux
    openscap: [accounts_password_pam_pwhistory_remember_password_auth,
               accounts_password_pam_pwhistory_remember_system_auth,
               accounts_password_pam_unix_remember]
    remediation: Включить pam_pwhistory (remember ≥ 5) в стеке смены пароля.
    doc: https://man7.org/linux/man-pages/man8/pam_pwhistory.8.html

  - id: no_empty_passwords
    title: Нет входа с пустым паролем
    platform: linux
    openscap: [no_empty_passwords, sshd_disable_empty_passwords]
    remediation: Убрать nullok из PAM; в sshd_config — PermitEmptyPasswords no.
    doc: https://man.openbsd.org/sshd_config#PermitEmptyPasswords

  - id: weak_credentials
    title: Нет слабых и стандартных учётных данных
    platform: any
    cred_audit: true
    remediation: >-
      Сменить пароли учётных записей, подобранных из набора проверки; отключить
      стандартные учётные записи; включить блокировку после неудачных попыток.
    doc: https://bdu.fstec.ru/

  - id: auth_hash_files
    title: Защита файлов учётных записей и хешей паролей
    platform: linux
    openscap: [file_permissions_etc_shadow, file_owner_etc_shadow, file_permissions_etc_gshadow,
               file_permissions_etc_passwd, file_permissions_etc_group]
    remediation: Права /etc/shadow и /etc/gshadow — 0000 или 0640 (root:shadow), /etc/passwd и /etc/group — 0644.
    doc: https://man7.org/linux/man-pages/man5/shadow.5.html

  - id: ssh_root_login
    title: Запрет прямого входа root по SSH
    platform: linux
    openscap: [sshd_disable_root_login]
    remediation: В sshd_config задать PermitRootLogin no; администрирование — через личные учётки и sudo.
    doc: https://man.openbsd.org/sshd_config#PermitRootLogin

  - id: ssh_max_auth_tries
    title: Ограничение попыток аутентификации SSH
    platform: linux
    openscap: [sshd_set_max_auth_tries]
    lynis: [SSH-7408]
    remediation: В sshd_config задать MaxAuthTries 4 или меньше.
    doc: https://man.openbsd.org/sshd_config#MaxAuthTries

  - id: ntlm_no_lm
    title: Запрет LM и NTLMv1 (Windows)
    platform: windows
    windows:
      - {key: LmCompatibilityLevel, op: ge, value: 3, missing: 3}
    remediation: >-
      Политика «Сетевая безопасность: уровень проверки подлинности LAN Manager» —
      не ниже «Отправлять только NTLMv2-ответ» (LmCompatibilityLevel ≥ 3).
    doc: https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level

  - id: ntlm_v2_only
    title: Только NTLMv2, LM и NTLM отклоняются (Windows)
    platform: windows
    windows:
      - {key: LmCompatibilityLevel, op: ge, value: 5, missing: 3}
    remediation: LmCompatibilityLevel = 5 («Отправлять только NTLMv2-ответ. Отказывать LM и NTLM»).
    doc: https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level

  - id: lsa_protection
    title: Защита процесса LSA от чтения учётных данных (Windows)
    platform: windows
    windows:
      - {key: RunAsPPL, op: ge, value: 1, missing: 0}
    remediation: Включить RunAsPPL = 1 (HKLM\SYSTEM\CurrentControlSet\Control\Lsa) — защищённый процесс LSA.
    doc: https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection

  # ---------- Управление доступом ----------
  - id: least_privilege_sudo
    title: Повышение прав только с аутентификацией (sudo)
    platform: linux
    openscap: [sudo_remove_nopasswd, sudo_remove_no_authenticate, sudo_require_authentication]
    remediation: Убрать NOPASSWD и !authenticate из /etc/sudoers и /etc/sudoers.d.
    doc: https://www.sudo.ws/docs/man/sudoers.man/

  - id: uac
    title: Контроль учётных записей (UAC) включён (Windows)
    platform: windows
    windows:
      - {key: UAC_EnableLUA, op: eq, value: 1, missing: 1}
    remediation: "Включить политику «Контроль учётных записей: все администраторы работают в режиме одобрения» (EnableLUA = 1)."
    doc: https://learn.microsoft.com/windows/security/application-security/application-control/user-account-control/settings-and-configuration

  - id: session_timeout
    title: Блокирование сеанса при неактивности
    platform: linux
    openscap: [accounts_tmout, sshd_set_idle_timeout, sshd_set_keepalive]
    lynis: [SHLL-6220]
    remediation: Задать TMOUT (например, 900) в профиле оболочки; в sshd_config — ClientAliveInterval и ClientAliveCountMax.
    doc: https://man.openbsd.org/sshd_config#ClientAliveInterval

  - id: login_banner
    title: Предупреждение пользователя при входе
    platform: linux
    openscap: [banner_etc_issue, banner_etc_issue_net, sshd_enable_warning_banner]
    lynis: [BANN-7126, BANN-7130]
    remediation: Разместить текст предупреждения в /etc/issue и /etc/issue.net; в sshd_config — Banner /etc/issue.net.
    doc: https://man.openbsd.org/sshd_config#Banner

  - id: boot_loader_password
    title: Защита загрузчика паролем
    platform: linux
    openscap: [grub2_password, grub2_uefi_password, file_permissions_grub2_cfg, file_owner_grub2_cfg]
    lynis: [BOOT-5122]
    remediation: Задать пароль суперпользователя GRUB 2 (grub2-setpassword / password_pbkdf2) и права 0600 на grub.cfg.
    doc: https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html

  - id: firewall_enabled
    title: Межсетевой экран узла включён
    platform: linux
    openscap: [service_firewalld_enabled, package_firewalld_installed, service_ufw_enabled,
               package_ufw_installed, service_nftables_enabled]
    lynis: [FIRE-4590]
    remediation: Включить firewalld/ufw/nftables с политикой «запрещено всё, что не разрешено».
    doc: https://firewalld.org/documentation/

  - id: ip_forwarding_redirects
    title: Сетевые параметры ядра (маршрутизация, ICMP-перенаправления)
    platform: linux
    openscap: [sysctl_net_ipv4_ip_forward, sysctl_net_ipv4_conf_all_accept_redirects,
               sysctl_net_ipv4_conf_all_send_redirects, sysctl_net_ipv4_conf_all_accept_source_route,
               sysctl_net_ipv4_conf_all_rp_filter, sysctl_net_ipv4_tcp_syncookies]
    lynis: [KRNL-6000]
    remediation: Задать параметры sysctl по бенчмарку (ip_forward=0, accept_redirects=0, send_redirects=0, rp_filter=1, tcp_syncookies=1).
    doc: https://www.kernel.org/doc/Documentation/networking/ip-sysctl.txt

  - id: mac_enabled
    title: Мандатный контроль доступа (SELinux/AppArmor) включён
    platform: linux
    openscap: [selinux_state, selinux_policytype, grub2_enable_apparmor, package_apparmor_installed,
               all_apparmor_profiles_enforced]
    remediation: Включить SELinux (enforcing) или AppArmor (профили в режиме enforce); для Astra Linux — мандатный контроль целостности/доступа.
    doc: https://wiki.debian.org/AppArmor

  # ---------- Удалённый доступ и каналы связи ----------
  - id: insecure_remote_protocols
    title: Нет открытых сервисов с передачей данных в открытом виде
    platform: any
    services:
      names: [telnet, ftp, tftp, login, shell, exec, rlogin, rsh, rexec, vnc]
      tcp_ports: [21, 23, 512, 513, 514]
      udp_ports: [69]
    remediation: >-
      Отключить telnet, FTP, TFTP, r-сервисы и VNC без туннеля; для удалённого
      доступа использовать SSH/RDP с NLA/VPN, для передачи файлов — SFTP/FTPS.
    doc: https://bdu.fstec.ru/

  - id: insecure_packages
    title: Не установлены серверы небезопасных протоколов
    platform: linux
    openscap: [package_telnet-server_removed, package_rsh-server_removed, package_tftp-server_removed,
               package_xinetd_removed, package_telnetd_removed, package_rsh-server_removed,
               package_inetutils-telnetd_removed, package_nis_removed]
    remediation: Удалить пакеты telnet-server, rsh-server, tftp-server, xinetd, nis.
    doc: https://bdu.fstec.ru/

  - id: ssh_crypto
    title: Стойкие криптоалгоритмы SSH
    platform: linux
    openscap: [sshd_use_strong_ciphers, sshd_use_strong_macs, sshd_use_strong_kex,
               sshd_use_approved_ciphers, sshd_use_approved_macs]
    remediation: Ограничить Ciphers, MACs и KexAlgorithms в sshd_config стойкими алгоритмами.
    doc: https://man.openbsd.org/sshd_config#Ciphers

  - id: rdp_nla
    title: RDP только с проверкой подлинности на уровне сети (Windows)
    platform: windows
    windows:
      - {key: RDP_NLA, op: eq, value: 1, missing: na,
         when: {key: RDP_fDenyTSConnections, op: eq, value: 0, missing: 1}}
    remediation: Включить «Требовать проверку подлинности пользователя на уровне сети» (UserAuthentication = 1) или отключить RDP.
    doc: https://learn.microsoft.com/troubleshoot/windows-server/remote/remote-desktop-services-network-level-authentication

  - id: smb1_disabled
    title: SMBv1 отключён (Windows)
    platform: windows
    windows:
      - {key: SMB1, op: eq, value: 0, missing: na}
    remediation: Отключить SMBv1 (Set-SmbServerConfiguration -EnableSMB1Protocol $false и удалить компонент SMB1).
    doc: https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

  # ---------- Регистрация событий и время ----------
  - id: audit_daemon
    title: Подсистема аудита (auditd) установлена и запущена
    platform: linux
    openscap: [package_audit_installed, service_auditd_enabled, grub2_audit_argument]
    lynis: [ACCT-9628]
    remediation: Установить и включить auditd, добавить audit=1 в параметры ядра.
    doc: https://man7.org/linux/man-pages/man8/auditd.8.html

  - id: audit_rules
    title: Регистрация событий безопасности (правила аудита)
    platform: linux
    openscap: [audit_rules_login_events, audit_rules_session_events, audit_rules_privileged_commands,
               audit_rules_usergroup_modification, audit_rules_usergroup_modification_passwd,
               audit_rules_usergroup_modification_shadow, audit_rules_sudoers,
               audit_rules_time_adjtimex, audit_rules_time_settimeofday,
               audit_rules_mac_modification, audit_rules_networkconfig_modification,
               audit_rules_dac_modification_chmod, audit_rules_kernel_module_loading]
    lynis: [ACCT-9630]
    remediation: Добавить правила аудита входов, сеансов, привилегированных команд, изменения учётных записей, времени и политик (/etc/audit/rules.d).
    doc: https://man7.org/linux/man-pages/man7/audit.rules.7.html

  - id: audit_storage
    title: Реакция на переполнение и сбои журнала аудита
    platform: linux
    openscap: [auditd_data_retention_space_left_action, auditd_data_retention_admin_space_left_action,
               auditd_data_retention_max_log_file_action, auditd_data_disk_full_action,
               auditd_data_disk_error_action, auditd_data_retention_max_log_file]
    remediation: Настроить space_left_action, admin_space_left_action, disk_full_action и max_log_file_action в auditd.conf.
    doc: https://man7.org/linux/man-pages/man5/auditd.conf.5.html

  - id: audit_log_protection
    title: Защита журналов событий
    platform: linux
    openscap: [file_permissions_var_log_audit, file_ownership_var_log_audit_stig,
               directory_permissions_var_log_audit, audit_rules_immutable, rsyslog_files_permissions,
               file_permissions_var_log]
    remediation: Права журналов аудита — 0600 (каталог 0700), владелец root; включить неизменяемость правил (-e 2).
    doc: https://man7.org/linux/man-pages/man5/auditd.conf.5.html

  - id: syslog
    title: Сбор системных журналов (rsyslog/journald)
    platform: linux
    openscap: [package_rsyslog_installed, service_rsyslog_enabled, journald_storage,
               journald_compress, rsyslog_remote_loghost]
    lynis: [LOGG-2130]
    remediation: Установить и включить rsyslog (или постоянное хранение journald) и передачу журналов на сервер сбора.
    doc: https://www.rsyslog.com/doc/

  - id: time_sync
    title: Синхронизация системного времени
    platform: linux
    openscap: [service_chronyd_or_ntpd_enabled, chronyd_specify_remote_server, ntpd_specify_remote_server,
               package_chrony_installed, service_timesyncd_enabled, service_chronyd_enabled]
    lynis: [TIME-3104]
    remediation: Включить chrony/ntpd/systemd-timesyncd с доверенным источником времени.
    doc: https://chrony-project.org/documentation.html

  # ---------- Антивирус, целостность, ПО ----------
  - id: antimalware
    title: Средство антивирусной защиты установлено
    platform: linux
    lynis: [MALW-3280]
    remediation: Установить сертифицированное средство антивирусной защиты и настроить обновление баз.
    doc: https://bdu.fstec.ru/

  - id: file_integrity
    title: Контроль целостности файлов (AIDE и аналоги)
    platform: linux
    openscap: [package_aide_installed, aide_build_database, aide_periodic_cron_checking,
               rpm_verify_hashes, rpm_verify_permissions]
    lynis: [FINT-4350]
    remediation: Установить AIDE (или средство контроля целостности), построить эталонную базу и проверять её по расписанию.
    doc: https://aide.github.io/

  - id: package_signatures
    title: Установка только подписанных пакетов
    platform: linux
    openscap: [ensure_gpgcheck_globally_activated, ensure_gpgcheck_never_disabled,
               ensure_gpgcheck_local_packages, ensure_redhat_gpgkey_installed]
    remediation: Включить gpgcheck=1 в настройках менеджера пакетов и не отключать его для репозиториев.
    doc: https://man7.org/linux/man-pages/man5/yum.conf.5.html

  - id: unneeded_services
    title: Отключены лишние сетевые службы
    platform: linux
    openscap: [service_avahi-daemon_disabled, service_cups_disabled, package_avahi_removed,
               service_rpcbind_disabled, package_squid_removed, package_net-snmp_removed,
               package_vsftpd_removed, package_dhcp_removed, package_bind_removed,
               service_autofs_disabled]
    lynis: [NETW-3200]
    remediation: Удалить или отключить сетевые службы, не нужные для функций узла (avahi, cups, rpcbind, autofs и т. п.).
    doc: https://bdu.fstec.ru/

  - id: removable_media
    title: Ограничение подключения съёмных носителей
    platform: linux
    openscap: [kernel_module_usb-storage_disabled, service_autofs_disabled]
    lynis: [USB-1000, STRG-1846]
    remediation: Запретить загрузку модуля usb-storage (install usb-storage /bin/false) и автомонтирование.
    doc: https://man7.org/linux/man-pages/man5/modprobe.d.5.html

  - id: hardening_kernel
    title: Защитные параметры ядра и файловых систем
    platform: linux
    openscap: [sysctl_kernel_randomize_va_space, sysctl_fs_suid_dumpable, coredump_disable_storage,
               mount_option_tmp_noexec, mount_option_dev_shm_noexec, mount_option_dev_shm_nosuid,
               sysctl_kernel_dmesg_restrict, sysctl_kernel_yama_ptrace_scope]
    remediation: Включить ASLR, запретить дампы памяти setuid-программ, монтировать /tmp и /dev/shm с noexec,nosuid.
    doc: https://www.kernel.org/doc/Documentation/sysctl/kernel.txt

  - id: auto_updates_windows
    title: Автоматическое обновление не отключено (Windows)
    platform: windows
    windows:
      - {key: NoAutoUpdate, op: ne, value: 1, missing: 0}
    remediation: Не отключать Windows Update (NoAutoUpdate ≠ 1); обновления — через WSUS/централизованно.
    doc: https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

  # ---------- Уязвимости и обновления ----------
  - id: no_critical_vulns
    title: Нет известных уязвимостей критического и высокого уровня
    platform: any
    vulns: {min_severity: high, modules: [vuln, auth_inventory, win_inventory]}
    remediation: Устранить уязвимости критического и высокого уровня (обновления вендора, компенсирующие меры по БДУ ФСТЭК).
    doc: https://bdu.fstec.ru/

  - id: security_updates
    title: Установлены обновления безопасности ОС и ПО
    platform: any
    vulns: {min_severity: medium, modules: [auth_inventory, win_inventory]}
    openscap: [security_patches_up_to_date]
    lynis: [PKGS-7392]
    remediation: Установить доступные обновления безопасности ОС и ПО (для Windows — отсутствующие KB из отчёта).
    doc: https://bdu.fstec.ru/
