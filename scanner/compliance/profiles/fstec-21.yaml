      - {id: ИНЦ.3, title: "Своевременное информирование лиц, ответственных за выявление инцидентов и реагирование на них, о возникновении инцидентов в информационной системе пользователями и администраторами", levels: [УЗ1, УЗ2]}
      - {id: ИНЦ.4, title: "Анализ инцидентов, в том числе определение источников и причин возникновения инцидентов, а также оценка их последствий", levels: [УЗ1, УЗ2]}
      - {id: ИНЦ.5, title: "Принятие мер по устранению последствий инцидентов", levels: [УЗ1, УЗ2]}
      - {id: ИНЦ.6, title: "Планирование и принятие мер по предотвращению повторного возникновения инцидентов", levels: [УЗ1, УЗ2]}

