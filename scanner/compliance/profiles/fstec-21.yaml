      - {id: УКФ.2, title: "Управление изменениями конфигурации информационной системы и системы защиты информации", levels: [УЗ1, УЗ2]}
      - {id: УКФ.3, title: "Анализ потенциального воздействия планируемых изменений в конфигурации информационной системы и системы защиты информации на обеспечение защиты информации и согласование изменений с должностным лицом (работником), ответственным за обеспечение безопасности информации", levels: [УЗ1, УЗ2]}
      - {id: УКФ.4, title: "Документирование информации (данных) об изменениях в конфигурации информационной системы и системы защиты информации", levels: [УЗ1, УЗ2]}
