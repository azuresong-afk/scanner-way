# Приказ ФСТЭК России от 18.02.2013 №21 — меры по обеспечению безопасности
# персональных данных при их обработке в ИСПДн (состав и содержание мер —
# приложение к приказу; базовый набор по уровням защищённости УЗ1–УЗ4).
#
# Формат — как у fstec-117.yaml: levels — уровни защищённости, для которых мера
# входит в базовый набор; меры без checks проверяются вручную. Базовый набор
# адаптируется под систему (excluded/added в профиле договора).

id: fstec-21
title: Приказ ФСТЭК России №21 (ИСПДн)
short: ФСТЭК №21
document: >-
  Состав и содержание организационных и технических мер по обеспечению
  безопасности персональных данных при их обработке в информационных системах
  персональных данных (утв. приказом ФСТЭК России от 18.02.2013 №21)
url: https://fstec.ru/dokumenty/vse-dokumenty/prikazy/prikaz-fstek-rossii-ot-18-fevralya-2013-g-n-21
level_label: Уровень защищённости ПДн
levels: [УЗ1, УЗ2, УЗ3, УЗ4]
default_level: УЗ3

groups:
  - code: ИАФ
    title: Идентификация и аутентификация субъектов доступа и объектов доступа
    controls:
      - {id: ИАФ.1, title: "Идентификация и аутентификация пользователей, являющихся работниками оператора", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [no_empty_passwords, ssh_root_login, weak_credentials, ntlm_no_lm]}
      - {id: ИАФ.2, title: "Идентификация и аутентификация устройств, в том числе стационарных, мобильных и портативных", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: ИАФ.3, title: "Управление идентификаторами, в том числе создание, присвоение, уничтожение идентификаторов", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ИАФ.4, title: "Управление средствами аутентификации, в том числе хранение, выдача, инициализация, блокирование средств аутентификации и принятие мер в случае утраты и (или) компрометации средств аутентификации", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [password_length, password_complexity, password_age, password_history, auth_hash_files, lsa_protection]}
      - {id: ИАФ.5, title: "Защита обратной связи при вводе аутентификационной информации", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ИАФ.6, title: "Идентификация и аутентификация пользователей, не являющихся работниками оператора (внешних пользователей)", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [weak_credentials]}
      - {id: ИАФ.7, title: "Идентификация и аутентификация объектов файловой системы, запускаемых и исполняемых модулей, объектов систем управления базами данных, объектов, создаваемых прикладным и специальным программным обеспечением, иных объектов доступа", levels: []}

  - code: УПД
    title: Управление доступом субъектов доступа к объектам доступа
    controls:
      - {id: УПД.1, title: "Управление (заведение, активация, блокирование и уничтожение) учётными записями пользователей, в том числе внешних пользователей", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: УПД.2, title: "Реализация необходимых методов (дискреционный, мандатный, ролевой или иной метод), типов (чтение, запись, выполнение или иной тип) и правил разграничения доступа", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [auth_hash_files, mac_enabled]}
      - {id: УПД.3, title: "Управление (фильтрация, маршрутизация, контроль соединений, однонаправленная передача и иные способы управления) информационными потоками между устройствами, сегментами информационной системы, а также между информационными системами", levels: [УЗ1, УЗ2, УЗ3], checks: [firewall_enabled, ip_forwarding_redirects]}
      - {id: УПД.4, title: "Разделение полномочий (ролей) пользователей, администраторов и лиц, обеспечивающих функционирование информационной системы", levels: [УЗ1, УЗ2, УЗ3], checks: [ssh_root_login]}
      - {id: УПД.5, title: "Назначение минимально необходимых прав и привилегий пользователям, администраторам и лицам, обеспечивающим функционирование информационной системы", levels: [УЗ1, УЗ2, УЗ3], checks: [least_privilege_sudo, uac]}
      - {id: УПД.6, title: "Ограничение неуспешных попыток входа в информационную систему (доступа к информационной системе)", levels: [УЗ1, УЗ2, УЗ3], checks: [lockout, ssh_max_auth_tries]}
      - {id: УПД.7, title: "Предупреждение пользователя при его входе в информационную систему о том, что в информационной системе реализованы меры защиты информации, и о необходимости соблюдения им установленных оператором правил обработки информации", levels: [], checks: [login_banner]}
      - {id: УПД.8, title: "Оповещение пользователя после успешного входа в информационную систему о его предыдущем входе в информационную систему", levels: []}
      - {id: УПД.9, title: "Ограничение числа параллельных сеансов доступа для каждой учётной записи пользователя информационной системы", levels: []}
      - {id: УПД.10, title: "Блокирование сеанса доступа в информационную систему после установленного времени бездействия (неактивности) пользователя или по его запросу", levels: [УЗ1, УЗ2, УЗ3], checks: [session_timeout]}
      - {id: УПД.11, title: "Разрешение (запрет) действий пользователей, разрешённых до идентификации и аутентификации", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: УПД.12, title: "Поддержка и сохранение атрибутов безопасности (меток безопасности), связанных с информацией в процессе её хранения и обработки", levels: []}
      - {id: УПД.13, title: "Реализация защищённого удалённого доступа субъектов доступа к объектам доступа через внешние информационно-телекоммуникационные сети", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [insecure_remote_protocols, ssh_crypto, rdp_nla]}
      - {id: УПД.14, title: "Регламентация и контроль использования в информационной системе технологий беспроводного доступа", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: УПД.15, title: "Регламентация и контроль использования в информационной системе мобильных технических средств", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: УПД.16, title: "Управление взаимодействием с информационными системами сторонних организаций (внешние информационные системы)", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: УПД.17, title: "Обеспечение доверенной загрузки средств вычислительной техники", levels: [УЗ1, УЗ2, УЗ3], checks: [boot_loader_password]}

  - code: ОПС
    title: Ограничение программной среды
    controls:
      - {id: ОПС.1, title: "Управление запуском (обращениями) компонентов программного обеспечения, в том числе определение запускаемых компонентов, настройка параметров запуска компонентов, контроль за запуском компонентов программного обеспечения", levels: [УЗ1]}
      - {id: ОПС.2, title: "Управление установкой (инсталляцией) компонентов программного обеспечения, в том числе определение компонентов, подлежащих установке, настройка параметров установки компонентов, контроль за установкой компонентов программного обеспечения", levels: [УЗ1, УЗ2], checks: [package_signatures]}
      - {id: ОПС.3, title: "Установка (инсталляция) только разрешённого к использованию программного обеспечения и (или) его компонентов", levels: [УЗ1, УЗ2], checks: [insecure_packages, unneeded_services]}
      - {id: ОПС.4, title: "Управление временными файлами, в том числе запрет, разрешение, перенаправление записи, удаление временных файлов", levels: []}

  - code: ЗНИ
    title: Защита машинных носителей информации
    controls:
      - {id: ЗНИ.1, title: "Учёт машинных носителей информации", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: ЗНИ.2, title: "Управление доступом к машинным носителям информации", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: ЗНИ.3, title: "Контроль перемещения машинных носителей информации, используемых в информационной системе, за пределы контролируемой зоны", levels: [УЗ1]}
      - {id: ЗНИ.4, title: "Исключение возможности несанкционированного ознакомления с содержанием информации, хранящейся на машинных носителях, и (или) использования носителей информации в иных информационных системах", levels: [УЗ1]}
      - {id: ЗНИ.5, title: "Контроль использования интерфейсов ввода (вывода) информации на машинные носители информации", levels: [УЗ1, УЗ2], checks: [removable_media]}
      - {id: ЗНИ.6, title: "Контроль ввода (вывода) информации на машинные носители информации", levels: []}
      - {id: ЗНИ.7, title: "Контроль подключения машинных носителей информации", levels: [], checks: [removable_media]}
      - {id: ЗНИ.8, title: "Уничтожение (стирание) информации на машинных носителях при их передаче между пользователями, в сторонние организации для ремонта или утилизации, а также контроль уничтожения (стирания)", levels: [УЗ1, УЗ2, УЗ3]}

  - code: РСБ
    title: Регистрация событий безопасности
    controls:
      - {id: РСБ.1, title: "Определение событий безопасности, подлежащих регистрации, и сроков их хранения", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [audit_daemon, audit_rules]}
      - {id: РСБ.2, title: "Определение состава и содержания информации о событиях безопасности, подлежащих регистрации", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [audit_rules]}
      - {id: РСБ.3, title: "Сбор, запись и хранение информации о событиях безопасности в течение установленного времени хранения", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [audit_daemon, syslog]}
      - {id: РСБ.4, title: "Реагирование на сбои при регистрации событий безопасности, в том числе аппаратные и программные ошибки, сбои в механизмах сбора информации и достижение предела объёма памяти", levels: [УЗ1, УЗ2, УЗ3], checks: [audit_storage]}
      - {id: РСБ.5, title: "Мониторинг (просмотр, анализ) результатов регистрации событий безопасности и реагирование на них", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: РСБ.6, title: "Генерирование временных меток и (или) синхронизация системного времени в информационной системе", levels: [УЗ1, УЗ2, УЗ3], checks: [time_sync]}
      - {id: РСБ.7, title: "Защита информации о событиях безопасности", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [audit_log_protection]}
      - {id: РСБ.8, title: "Обеспечение возможности просмотра и анализа информации о действиях отдельных пользователей в информационной системе", levels: [УЗ1]}

  - code: АВЗ
    title: Антивирусная защита
    controls:
      - {id: АВЗ.1, title: "Реализация антивирусной защиты", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [antimalware]}
      - {id: АВЗ.2, title: "Обновление базы данных признаков вредоносных компьютерных программ (вирусов)", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}

  - code: СОВ
    title: Обнаружение (предотвращение) вторжений
    controls:
      - {id: СОВ.1, title: "Обнаружение вторжений", levels: [УЗ1, УЗ2]}
      - {id: СОВ.2, title: "Обновление базы решающих правил", levels: [УЗ1, УЗ2]}

  - code: АНЗ
    title: Контроль (анализ) защищённости информации
    controls:
      - {id: АНЗ.1, title: "Выявление, анализ уязвимостей информационной системы и оперативное устранение вновь выявленных уязвимостей", levels: [УЗ1, УЗ2, УЗ3], checks: [no_critical_vulns]}
      - {id: АНЗ.2, title: "Контроль установки обновлений программного обеспечения, включая обновление программного обеспечения средств защиты информации", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [security_updates, auto_updates_windows]}
      - {id: АНЗ.3, title: "Контроль работоспособности, параметров настройки и правильности функционирования программного обеспечения и средств защиты информации", levels: [УЗ1, УЗ2, УЗ3], checks: [firewall_enabled, audit_daemon, mac_enabled, hardening_kernel, smb1_disabled]}
      - {id: АНЗ.4, title: "Контроль состава технических средств, программного обеспечения и средств защиты информации", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: АНЗ.5, title: "Контроль правил генерации и смены паролей пользователей, заведения и удаления учётных записей пользователей, реализации правил разграничения доступа, полномочий пользователей в информационной системе", levels: [УЗ1, УЗ2, УЗ3], checks: [password_length, password_complexity, password_age, lockout, least_privilege_sudo]}

  - code: ОЦЛ
    title: Обеспечение целостности информационной системы и информации
    controls:
      - {id: ОЦЛ.1, title: "Контроль целостности программного обеспечения, включая программное обеспечение средств защиты информации", levels: [УЗ1, УЗ2], checks: [file_integrity]}
      - {id: ОЦЛ.2, title: "Контроль целостности информации, содержащейся в базах данных информационной системы", levels: []}
      - {id: ОЦЛ.3, title: "Обеспечение возможности восстановления программного обеспечения, включая программное обеспечение средств защиты информации, при возникновении нештатных ситуаций", levels: [УЗ1, УЗ2]}
      - {id: ОЦЛ.4, title: "Обнаружение и реагирование на поступление в информационную систему незапрашиваемых электронных сообщений (писем, документов) и иной информации, не относящихся к функционированию информационной системы (защита от спама)", levels: [УЗ1, УЗ2]}

  - code: ОДТ
    title: Обеспечение доступности информации
    controls:
      - {id: ОДТ.1, title: "Использование отказоустойчивых технических средств", levels: [УЗ1]}
      - {id: ОДТ.2, title: "Резервирование технических средств, программного обеспечения, каналов передачи информации, средств обеспечения функционирования информационной системы", levels: [УЗ1]}
      - {id: ОДТ.3, title: "Контроль безотказного функционирования технических средств, обнаружение и локализация отказов функционирования, принятие мер по восстановлению отказавших средств и их тестирование", levels: [УЗ1, УЗ2]}
      - {id: ОДТ.4, title: "Периодическое резервное копирование информации на резервные машинные носители информации", levels: [УЗ1, УЗ2, УЗ3]}
      - {id: ОДТ.5, title: "Обеспечение возможности восстановления информации с резервных машинных носителей информации (резервных копий) в течение установленного временного интервала", levels: [УЗ1, УЗ2, УЗ3]}

  - code: ЗСВ
    title: Защита среды виртуализации
    controls:
      - {id: ЗСВ.1, title: "Идентификация и аутентификация субъектов доступа и объектов доступа в виртуальной инфраструктуре, в том числе администраторов управления средствами виртуализации", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗСВ.2, title: "Управление доступом субъектов доступа к объектам доступа в виртуальной инфраструктуре, в том числе внутри виртуальных машин", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗСВ.3, title: "Регистрация событий безопасности в виртуальной инфраструктуре", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗСВ.9, title: "Реализация и управление антивирусной защитой в виртуальной инфраструктуре", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗСВ.10, title: "Разбиение виртуальной инфраструктуры на сегменты (сегментирование виртуальной инфраструктуры) для обработки информации отдельным пользователем и (или) группой пользователей", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}

  - code: ЗТС
    title: Защита технических средств
    controls:
      - {id: ЗТС.2, title: "Организация контролируемой зоны, в пределах которой постоянно размещаются стационарные технические средства, обрабатывающие информацию, и средства защиты информации", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗТС.3, title: "Контроль и управление физическим доступом к техническим средствам, средствам защиты информации, средствам обеспечения функционирования, а также в помещения и сооружения, в которых они установлены", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}
      - {id: ЗТС.4, title: "Размещение устройств вывода (отображения) информации, исключающее её несанкционированный просмотр", levels: [УЗ1, УЗ2, УЗ3, УЗ4]}

  - code: ЗИС
    title: Защита информационной системы, её средств, систем связи и передачи данных
    controls:
      - {id: ЗИС.1, title: "Разделение в информационной системе функций по управлению (администрированию) информационной системой, управлению (администрированию) системой защиты информации, функций по обработке информации и иных функций информационной системы", levels: [УЗ1]}
      - {id: ЗИС.3, title: "Обеспечение защиты информации от раскрытия, модификации и навязывания (ввода ложной информации) при её передаче (подготовке к передаче) по каналам связи, имеющим выход за пределы контролируемой зоны, в том числе беспроводным каналам связи", levels: [УЗ1, УЗ2, УЗ3, УЗ4], checks: [insecure_remote_protocols, ssh_crypto, ntlm_no_lm]}
      - {id: ЗИС.5, title: "Запрет несанкционированной удалённой активации видеокамер, микрофонов и иных периферийных устройств, которые могут активироваться удалённо, и оповещение пользователей об активации таких устройств", levels: [УЗ1, УЗ2]}
      - {id: ЗИС.11, title: "Обеспечение подлинности сетевых соединений (сеансов взаимодействия), в том числе для защиты от подмены сетевых устройств и сервисов", levels: [УЗ1, УЗ2], checks: [ssh_crypto, smb1_disabled]}
      - {id: ЗИС.17, title: "Разбиение информационной системы на сегменты (сегментирование информационной системы) и обеспечение защиты периметров сегментов информационной системы", levels: [УЗ1, УЗ2]}
      - {id: ЗИС.20, title: "Защита беспроводных соединений, применяемых в информационной системе", levels: [УЗ1, УЗ2, УЗ3]}

  - code: ИНЦ
