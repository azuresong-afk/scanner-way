# Приказ ФСТЭК России от 11.04.2025 №117 — защита информации в ГИС и иных
# информационных системах государственных органов, ГУП и госучреждений
# (действует с 01.03.2026, заменил приказ №17).
#
# Состав мероприятий (раздел III) и мер (раздел IV), базовый набор мер по
# классам — по методическому документу ФСТЭК России от 12.04.2026 «Состав и
# содержание мероприятий и мер по защите информации, содержащейся в
# информационных системах», приложение №2 (столбцы 3|2|1 → К3|К2|К1; «+» —
# мера входит в базовый набор, цифры — усиления). Мероприятия (процессы)
# реализуются для всех классов.
#
# levels — классы, в базовый набор которых входит мера; [] — мера не входит в
# базовый набор (добавляется оператором при адаптации). Меры без checks —
# организационные или вне возможностей сетевого сканера: в отчёте
# «проверяется вручную», в процент не входят. Сканер проверяет только
# техническую сторону меры на узлах; полнота реализации меры — за методистом.
# Класс К1 обеспечивает УЗ1–4 ПДн и категории КИИ I–III, К2 — УЗ2–4 и II–III,
# К3 — УЗ3–4 и III (приложение №3).

id: fstec-117
title: Приказ ФСТЭК России №117 (ГИС)
short: ФСТЭК №117
document: >-
  Требования о защите информации, содержащейся в государственных
  информационных системах, иных информационных системах государственных
  органов, государственных унитарных предприятий, государственных учреждений
  (утв. приказом ФСТЭК России от 11.04.2025 №117); методический документ ФСТЭК
  России от 12.04.2026 «Состав и содержание мероприятий и мер по защите
  информации, содержащейся в информационных системах»
url: https://fstec.ru/dokumenty/vse-dokumenty/spetsialnye-normativnye-dokumenty/trebovaniya-utverzhdeny-prikazom-fstek-rossii-ot-11-aprelya-2025-g-n-117
level_label: Класс защищённости
levels: [К1, К2, К3]
default_level: К2

groups:
  - code: МРП
    title: Мероприятия (процессы) по защите информации
    controls:
      - {id: ВУ, title: "Выявление и оценка угроз безопасности информации", levels: [К1, К2, К3]}
      - {id: КК, title: "Контроль конфигураций информационных систем", levels: [К1, К2, К3], checks: [hardening_kernel, unneeded_services, insecure_packages, smb1_disabled]}
      - {id: КУ, title: "Управление уязвимостями", levels: [К1, К2, К3], checks: [no_critical_vulns]}
      - {id: КО, title: "Управление обновлениями", levels: [К1, К2, К3], checks: [security_updates, auto_updates_windows]}
      - {id: ОД, title: "Обеспечение защиты информации при обработке, хранении и обращении с информацией ограниченного доступа", levels: [К1, К2, К3]}
      - {id: ЗУ, title: "Обеспечение защиты информации при использовании конечных устройств", levels: [К1, К2, К3]}
      - {id: МУ, title: "Обеспечение защиты информации при применении мобильных устройств", levels: [К1, К2, К3]}
      - {id: УД, title: "Обеспечение защиты информации при удалённом доступе пользователей к информационным системам", levels: [К1, К2, К3], checks: [insecure_remote_protocols, ssh_crypto, rdp_nla]}
      - {id: БД, title: "Обеспечение защиты информации при беспроводном доступе пользователей к информационным системам", levels: [К1, К2, К3]}
      - {id: ПД, title: "Обеспечение защиты информации при предоставлении пользователям привилегированного доступа", levels: [К1, К2, К3], checks: [least_privilege_sudo, uac, ssh_root_login]}
      - {id: МБ, title: "Обеспечение мониторинга информационной безопасности", levels: [К1, К2, К3], checks: [audit_daemon, syslog]}
      - {id: БР, title: "Обеспечение разработки безопасного программного обеспечения", levels: [К1, К2, К3]}
      - {id: ФЗ, title: "Обеспечение физической защиты информационных систем", levels: [К1, К2, К3]}
      - {id: НФ, title: "Обеспечение непрерывности функционирования информационных систем при возникновении нештатных ситуаций", levels: [К1, К2, К3]}
      - {id: УЗ, title: "Повышение уровня знаний и информированности пользователей по вопросам защиты информации", levels: [К1, К2, К3]}
      - {id: ЗП, title: "Обеспечение защиты информации при взаимодействии с подрядными организациями", levels: [К1, К2, К3]}
      - {id: ОО, title: "Обеспечение защиты от компьютерных атак, направленных на отказ в обслуживании", levels: [К1, К2, К3]}
      - {id: ИИ, title: "Обеспечение защиты информации при использовании искусственного интеллекта", levels: [К1, К2, К3]}
      - {id: ПК, title: "Проведение периодического контроля уровня защищённости информации, содержащейся в информационных системах", levels: [К1, К2, К3]}

