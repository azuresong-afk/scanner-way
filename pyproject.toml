[project]
name = "scanner"
version = "0.1.0"
description = "Authorized vulnerability scanner (pentest-by-contract)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "weasyprint>=62",
    "python-docx>=1.1",
    "httpx>=0.27",
    "python-libnmap>=0.7.3",
    "openpyxl>=3.1",
    "paramiko>=3.4",
    "cryptography>=42",
    # IANA-пояса для расписаний: в slim-образе может не быть /usr/share/zoneinfo
    "tzdata>=2024.1",
    # WinRM (HTTPS + NTLM) для учёток Windows: scanner/core/winexec.py (R3)
    "pywinrm>=0.5",
    # Профили соответствия ФСТЭК/CIS как данные: scanner/compliance/profiles/*.yaml (R5)
    "pyyaml>=6.0",
    # Вход через LDAP/Active Directory (опционально, SCANNER_API_LDAP_URL)
    "ldap3>=2.9",
    # QR-код для настройки двухфакторного входа (TOTP) в приложении на телефоне
    "segno>=1.6",
    # SNMP (v2c/v3 USM) для учёток сетевого оборудования: scanner/core/netexec.py
    "pysnmp>=7.1,<8",
    # Аудит СУБД (db_audit): MySQL/MariaDB, MS SQL Server, Oracle (тонкий режим,
    # без Oracle Client). PostgreSQL — psycopg выше.
    "pymysql>=1.1",
    "pymssql>=2.3",
    "oracledb>=2.0",
]

[project.scripts]
scanner = "scanner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]

# Линтер (CI: workflow checks). Набор правил — ошибки (E/F/W), сортировка
# импортов (I), типичные баги (B) и устаревший синтаксис (UP). Форматирование
# (ruff format) и длина строки не проверяются: массовое переформатирование
# сломало бы параллельные ветки.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # длина строки — см. выше
    "B905",  # zip() без strict=: в отчётах длины рядов заведомо равны
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E731",  # lambda в переменной для подмен в тестах
    "E402",  # импорт после настройки окружения теста
    "B011",  # assert False в недостижимых ветках теста
]

[tool.ruff.lint.isort]
known-first-party = ["scanner"]
