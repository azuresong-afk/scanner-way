[project]
name = "scanner"
version = "0.1.0"
description = "Authorized vulnerability scanner (pentest-by-contract)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "weasyprint>=62",
    "python-docx>=1.1",
    "httpx>=0.27",
    "python-libnmap>=0.7.3",
    "openpyxl>=3.1",
    "paramiko>=3.4",
    "cryptography>=42",
    # IANA-пояса для расписаний: в slim-образе может не быть /usr/share/zoneinfo
    "tzdata>=2024.1",
]

[project.scripts]
scanner = "scanner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]
