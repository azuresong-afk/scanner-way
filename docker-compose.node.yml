# Узел-сканер для изолированного сегмента (распределённое сканирование).
#
# Ставится на машину ВНУТРИ сегмента. Сам выходит на центральный сервер по
# HTTPS (исходящее TCP 443) — входящих портов на узле нет. Ни интерфейса, ни
# БД на узле нет: справочники БДУ/NVD читаются у центра, результат уходит в центр.
#
#   cp .env.node.example .env.node   # адрес центра, токен узла, сети сегмента
#   docker compose -f docker-compose.node.yml --env-file .env.node up -d
#   docker compose -f docker-compose.node.yml logs -f node
#   docker compose -f docker-compose.node.yml --env-file .env.node run --rm node check
#
# Без интернета образ переносится файлом:
#   на машине со сборкой:  docker compose -f docker-compose.node.yml build
#                          docker save scanner-node:latest | gzip > scanner-node.tar.gz
#   на узле:               docker load < scanner-node.tar.gz
#                          docker compose -f docker-compose.node.yml --env-file .env.node up -d --no-build
# своё имя проекта: не пересекается с центром, даже если запущен из того же каталога
name: scanner-node

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  node:
    build: .
    image: ${SCANNER_NODE_IMAGE:-scanner-node:latest}
    env_file: .env.node
    # агент узла вместо API: без миграций и БД (см. scanner/nodes/agent.py).
    # Проверка настроек и связи: docker compose -f docker-compose.node.yml run --rm node check
    entrypoint: ["scanner", "node"]
    command: ["run"]
    volumes:
      # очередь результатов (обрыв связи не теряет результат), ключи SSH/WinRM,
      # шаблоны Nuclei (приходят из центра)
      - node_data:/var/lib/scanner-node
      - node_nuclei:/root/nuclei-templates
      # сертификаты mTLS и CA центра (по желанию): ./node-certs/{ca.crt,node.crt,node.key}
      - ./node-certs:/certs:ro
    # nmap: SYN-сканирование и определение ОС
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # сеть хоста: узел сканирует сегмент со своего адреса, без NAT Docker
    network_mode: host
    restart: unless-stopped
    # Хелсчек агента: последняя удачная связь с центром не старше 10 минут
    # (агент отмечает её в /var/lib/scanner-node/health.json). Состояние —
    # docker compose -f docker-compose.node.yml ps; в центре — «Сканеры» и «Состояние».
    healthcheck:
      test: ["CMD", "scanner", "node", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *default-logging

volumes:
  node_data:
  node_nuclei:
