# Пример внешнего HTTPS-прокси центра с mTLS для узлов-сканеров.
#
# Пользователи открывают интерфейс по HTTPS как обычно; путь /api/node/v1/
# (протокол узлов) дополнительно требует клиентский сертификат узла, выданный
# вашим CA узлов. Прокси передаёт результат проверки в API заголовками, а API
# (SCANNER_NODE_MTLS_VERIFY_HEADER / SCANNER_NODE_MTLS_FINGERPRINT_HEADER в .env
# центра) отклоняет узел без сертификата и закрепляет отпечаток сертификата за
# узлом при первом подключении.
#
# ВАЖНО: веб-контейнер (порт SCANNER_WEB_PORT) должен быть доступен только этому
# прокси — иначе заголовки проверки можно подделать в обход прокси.
#
# Выпуск сертификатов (пример, openssl):
#   openssl req -x509 -newkey rsa:4096 -nodes -days 3650 -keyout nodes-ca.key \
#       -out nodes-ca.crt -subj "/CN=Scanner nodes CA"
#   openssl req -newkey rsa:2048 -nodes -keyout node.key -out node.csr -subj "/CN=filial-1"
#   openssl x509 -req -in node.csr -CA nodes-ca.crt -CAkey nodes-ca.key \
#       -CAcreateserial -days 825 -out node.crt
server {
    listen 443 ssl;
    server_name scanner.corp.local;

    ssl_certificate     /etc/nginx/tls/scanner.crt;
    ssl_certificate_key /etc/nginx/tls/scanner.key;

    # клиентский сертификат запрашивается, но обязателен только для узлов
    ssl_client_certificate /etc/nginx/tls/nodes-ca.crt;
    ssl_verify_client optional;

    location /api/node/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        client_max_body_size 256m;
        proxy_read_timeout 600s;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        # пользователи не передают этих заголовков: стереть, если пришли снаружи
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Fingerprint "";
        client_max_body_size 128m;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }
}
